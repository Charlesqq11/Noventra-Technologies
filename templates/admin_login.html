<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Noventra Technologies</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );

            color: #172033;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;

            border-radius: 16px;

            padding: 40px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.25);
        }

        .brand {
            text-align: center;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 3px;

            color: #64748b;

            margin-bottom: 12px;
        }

        h1 {
            text-align: center;

            margin: 0;

            font-size: 30px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            margin: 10px 0 30px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #d9dee8;

            border-radius: 8px;

            font-size: 15px;

            margin-bottom: 20px;

            outline: none;
        }

        input:focus {
            border-color: #64748b;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #111827;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #000000;
        }

        .error {
            background: #fef2f2;

            color: #b91c1c;

            border: 1px solid #fecaca;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .footer {
            text-align: center;

            color: #94a3b8;

            font-size: 12px;

            margin-top: 25px;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="brand">
                NOVENTRA TECHNOLOGIES
            </div>

            <h1>Admin Login</h1>

            <p class="subtitle">
                Sign in to manage project enquiries.
            </p>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="error">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >


                <button type="submit">
                    Sign In
                </button>

            </form>


            <div class="footer">
                © 2026 Noventra Technologies
            </div>

        </div>

    </div>

</body>

</html>
